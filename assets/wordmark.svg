<svg xmlns="http://www.w3.org/2000/svg" width="288" height="78" viewBox="0 0 288 78"
     role="img" aria-label="MCPeasy">
  <title>MCPeasy</title>

  <!--
    Animated wordmark for the top-level README.

    Colours are NOT eyeballed from a screenshot: they are the app's own
    .heading-gradient token in apps/desktop/src/renderer/src/styles.css:151,
    `linear-gradient(90deg, hsl(340 82% 60%), hsl(273 70% 58%))`, converted to
    the exact sRGB hex GitHub needs: hsl(340 82% 60%) = #ED457D and
    hsl(273 70% 58%) = #9B49DF. If that token is ever retuned, retune these two
    stops with it or the README drifts away from the running app.

    Why a self-contained SVG instead of a PNG: GitHub renders a README image in
    an img element, which SVG 2 puts in "secure animated mode". Declarative
    animation is allowed, but scripts and EXTERNAL REFERENCES are disabled
    (https://www.w3.org/TR/SVG2/conform.html#referencing-modes). That one rule
    drives both the self-contained font stack and the SMIL rather than JS
    animation.

    GEOMETRY IS MEASURED, NOT GUESSED. At font-size 64 the string "MCPeasy"
    sets 273.75 user units in Segoe UI and 288.09 in Arial, the widest fallback
    face (both measured in a real browser). textLength below is 274, i.e. the
    natural Segoe UI width, so the type is drawn at its true proportions.

    An earlier revision pinned textLength to 404 inside a 420 wide box. That is
    roughly 2.1x the natural width of the string, and because it used
    lengthAdjust="spacingAndGlyphs" it scaled the glyph OUTLINES to get there,
    which is what produced the stretched, distorted wordmark. If you change
    font-size, re-measure and move textLength, the viewBox width and the
    gradient period together.
  -->

  <defs>
    <!--
      Seamless loop, and the seam is the whole difficulty here.

      spreadMethod="repeat" tiles the ramp with period exactly (x2 minus x1),
      so translating by one full period is mathematically identical to
      translating by zero: the last frame equals the first and the loop has no
      visible snap. (Verified numerically: max per-channel difference between
      the t=0 and t=1 frames is 0.)

      This is why the stops are pink, purple, pink rather than a plain two-stop
      pink to purple ramp. With the default spreadMethod="pad" and a two-stop
      ramp the ends do not agree, and the wordmark jumps back to pink once per
      cycle. Do not "simplify" this to two stops or drop spreadMethod.

      The gradient period (x2 below) and the animation's "to" distance must
      stay equal. Changing one alone reintroduces the snap.
    -->
    <linearGradient id="brand" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="288" y2="0" spreadMethod="repeat">
      <stop offset="0%"   stop-color="#ED457D" />
      <stop offset="50%"  stop-color="#9B49DF" />
      <stop offset="100%" stop-color="#ED457D" />
      <!-- One period (288 user units) per 6s: slow enough to read as a sheen
           rather than a distraction in a document you are trying to read. -->
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="288 0" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <style>
    /*
      All system faces, deliberately. Secure animated mode blocks external
      references, so an @font-face webfont would silently fail and fall back.
      Better to name faces that are actually installed. Segoe UI first matches
      what the Windows app itself renders.
    */
    .wordmark {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /*
      Respect the reader's motion preference. prefers-reduced-motion cannot stop
      a SMIL animation by itself, so instead of trying to pause it we paint over
      it: a flat fill on the text wins over the animated gradient paint server
      (CSS beats a presentation attribute), holding the wordmark still.

      #C447AE is the 50% blend of #ED457D and #9B49DF, i.e. the colour halfway
      between the two brand stops. Note it is NOT the ramp's spatial midpoint:
      because the stops run pink, purple, pink, offset 50% is the pure purple
      #9B49DF. The blend is used deliberately so a reduced motion reader sees a
      single colour that reads as "between" the two brand ends.
    */
    @media (prefers-reduced-motion: reduce) {
      .wordmark { fill: #C447AE; }
    }
  </style>

  <!--
    lengthAdjust="spacing" (NOT "spacingAndGlyphs") is the safe variant: it can
    only open or close the gaps between glyphs, never scale the outlines. So a
    fallback face shifts the letterfit slightly but can never squash the
    letters. That distinction is the whole bug this revision fixes.
  -->
  <text class="wordmark" x="7" y="55" fill="url(#brand)"
        textLength="274" lengthAdjust="spacing">MCPeasy</text>
</svg>
