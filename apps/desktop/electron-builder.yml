# Packaging config for the MCPeasy desktop app.
#
# The README promises "MCPeasy ships as a packaged desktop app. Install it..."
# and the Integrations page registers the INSTALLED executable with Claude
# Code. Until this file existed that promise was unbuildable: the only script
# was `electron-vite build`, which emits loose bundles into out/ and no
# installer.
#
# Run it with `pnpm --filter @mcpeasy/desktop release` (see package.json).

# appId is the Windows identity of this app. It seeds the name-based UUIDv5
# that NSIS writes into the uninstall registry key, so CHANGING IT AFTER
# RELEASE ORPHANS EVERY EXISTING INSTALL — the next installer will not see the
# old one and users get two entries in Add/Remove Programs. Treat it as frozen.
appId: com.mcpeasy.desktop
productName: MCPeasy
copyright: Copyright © 2026 MCPeasy contributors

directories:
  # Icons and any future NSIS include live here. electron-builder picks up
  # build/icon.ico by convention; it is generated by scripts/make-icon.mjs so
  # the mark stays tied to the brand gradient rather than being a stray binary.
  buildResources: build
  # NOT "out": electron-vite already owns apps/desktop/out for its bundles.
  # Pointing the packager at the same directory would make it package its own
  # previous output on the second run.
  output: release

# What goes inside the asar.
#
# Ordering matters: later patterns override earlier ones. The first entry takes
# the built bundles; the rest strip sources and configs that would otherwise be
# swept in by electron-builder's default "everything not excluded" rule. This
# is a real privacy/size concern, not tidiness — src/ contains the full
# TypeScript source of the app.
files:
  - out/**
  - package.json
  - "!src${/*}"
  - "!scripts${/*}"
  - "!build${/*}"
  - "!release${/*}"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!electron-builder.yml"
  - "!tsconfig.*.json"

# Production dependencies are collected from node_modules and shipped.
#
# This is load-bearing, not boilerplate: electron.vite.config.ts deliberately
# leaves @modelcontextprotocol/sdk external (it is required at runtime rather
# than bundled), so the SDK and zod MUST be present in the packaged app or
# every MCP operation throws MODULE_NOT_FOUND.
#
# @mcpeasy/schema and @mcpeasy/engine are the opposite case. They are
# SOURCE-FIRST workspace packages whose exports point at .ts files, and
# electron-vite bundles them INTO out/main/index.js. They remain listed as
# dependencies for workspace linking, so electron-builder also copies them into
# the asar as raw TypeScript. That is dead weight rather than a fault — nothing
# requires them at runtime — but it is the reason the asar contains .ts files.
# Do not "fix" it by removing them from dependencies without checking that pnpm
# still links them for the build.

win:
  target:
    - target: nsis
      arch:
        - x64
  # The Claude Code / Claude Desktop integration registers this executable by
  # path, so its name is part of a user-visible contract written into their
  # config files. Renaming it breaks every previously registered server.
  executableName: MCPeasy

nsis:
  # PER-MACHINE, deliberately, and this is the one setting worth arguing about.
  #
  # electron-builder's default is a per-user install into
  # %LOCALAPPDATA%\Programs\<app> (see templates/nsis/multiUser.nsh). That needs
  # no elevation, which is friendlier — but it puts the executable at a path
  # containing the user's own account name, and the README plus the Claude
  # Desktop snippet document a single stable path under Program Files.
  # A stable, account-independent path is worth the UAC prompt here because the
  # whole integration story is "point your MCP client at this executable".
  perMachine: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MCPeasy
  uninstallDisplayName: MCPeasy
  # ${productName}, NOT ${name}. This package is named "@mcpeasy/desktop", and
  # ${name} expands to that scoped name verbatim — NSIS then read the "/" as a
  # path separator and tried to write release/@mcpeasy/desktop-0.1.0-setup.exe
  # into a directory that does not exist, failing with "Can't open output file".
  # ${productName} is sanitized for filenames, so it cannot reintroduce this.
  artifactName: ${productName}-${version}-setup.${ext}

# Electron's own binary is already built for the target platform, and this app
# has no native modules to rebuild (the whole dependency set is pure JS: the
# MCP SDK and zod). Skipping the rebuild avoids invoking a C++ toolchain that
# is not needed and may not exist on a contributor's machine.
npmRebuild: false

# No auto-update server exists yet. Declaring `publish: null` keeps
# electron-builder from generating latest.yml / blockmap update metadata that
# would advertise an update channel nothing serves.
publish: null
